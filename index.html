<!doctype html>
<!--
  Type Garden, remixed. As you type, stems and roses grow out of the letters.
  After Type Garden by Akshat Agarwal (https://type-garden.vercel.app, https://x.com/art_akshat).
  One self-contained file: canvas + plain JavaScript, no build step.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Type Garden</title>
  <meta name="description" content="Type, and a garden grows from your letters. Space cuts the stems, backspace withers them, enter clears.">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
    }

    [hidden] {
      display: none !important;
    }

    a {
      color: #FFFFFF;
    }

    a:hover {
      color: #FFB4A8;
    }

    .tg-app {
      position: fixed;
      inset: 0;
      background: #000;
      cursor: text;
      font-family: 'DM Mono', ui-monospace, monospace;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .tg-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* the real text field stays offscreen-small so phones still raise a keyboard */
    .tg-input {
      position: fixed;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      margin: 0;
      padding: 0;
      border: 0;
      opacity: 0;
      font-size: 16px;
      color: transparent;
      background: transparent;
      caret-color: transparent;
      pointer-events: none;
    }

    .tg-app button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* phones: fit the app to the area the keyboard leaves visible */
    html[data-touch] .tg-app {
      touch-action: none;
      top: var(--tg-top, 0px);
      bottom: auto;
      height: var(--tg-h, 100%);
    }

    /* ---------- mode switch ---------- */
    .tg-modes {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      right: calc(16px + env(safe-area-inset-right));
      z-index: 5;
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid #2A2A2A;
      border-radius: 999px;
      background: #000;
    }

    .tg-mode {
      border: 0;
      border-radius: 999px;
      padding: 7px 14px;
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: transparent;
      color: #BDBDBD;
    }

    .tg-mode[aria-pressed="true"] {
      background: #FFFFFF;
      color: #000000;
    }

    /* ---------- bottom bar ---------- */
    .tg-bar {
      position: absolute;
      left: calc(24px + env(safe-area-inset-left));
      right: calc(24px + env(safe-area-inset-right));
      bottom: calc(20px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
      letter-spacing: 0.04em;
      opacity: 0.6;
    }

    .tg-hints {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .tg-coarse {
      display: none;
    }

    @media (pointer: coarse) {
      .tg-fine {
        display: none;
      }

      .tg-coarse {
        display: inline;
      }
    }

    .tg-ctrls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .tg-pal {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 4px 6px;
      border: 1px solid #3A3A3A;
      border-radius: 999px;
    }

    .tg-swatch {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 999px;
      border: 1.5px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(var(--scale, 1));
    }

    .tg-swatch:hover {
      transform: scale(1.15);
    }

    .tg-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
    }

    .tg-btn {
      background: transparent;
      border: 1px solid #3A3A3A;
      color: #BDBDBD;
      font: inherit;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    .tg-btn:hover {
      border-color: #FFFFFF;
      color: #FFFFFF;
    }

    @media (max-width: 600px) {
      .tg-bar {
        left: calc(16px + env(safe-area-inset-left));
        right: calc(16px + env(safe-area-inset-right));
        bottom: calc(14px + env(safe-area-inset-bottom));
        gap: 10px;
      }

      .tg-hints {
        gap: 12px;
        font-size: 11px;
      }

      .tg-ctrls {
        flex: 1 1 100%;
        justify-content: space-between;
        gap: 8px;
      }

      .tg-pal {
        gap: 4px;
      }

      /* ten swatches share whatever width is left */
      .tg-swatch {
        --sw: clamp(13px, calc((100vw - 183px) / 10), 22px);
        width: var(--sw);
        height: var(--sw);
      }

      .tg-dot {
        width: calc(var(--sw) * 0.46);
        height: calc(var(--sw) * 0.46);
      }

      .tg-btn {
        padding: 7px 11px;
      }
    }

    /* ---------- poster ---------- */
    .tg-poster {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
      background: #000;
      cursor: default;
      color: #EDEDED;
      font-size: 12px;
      letter-spacing: 0.03em;
    }

    .tg-panel {
      border-right: 1px solid #1E1E1E;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px 22px 32px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      background: #0A0A0A;
    }

    .tg-head {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tg-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: 26px;
      color: #FFFFFF;
    }

    .tg-muted {
      color: #8C8C8C;
    }

    .tg-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tg-label {
      color: #8C8C8C;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .tg-words {
      background: #000;
      border: 1px solid #2A2A2A;
      border-radius: 10px;
      color: #FFFFFF;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: 22px;
      padding: 10px 12px;
      outline: none;
    }

    .tg-words:focus {
      border-color: #FFFFFF;
    }

    .tg-ghost {
      align-self: flex-start;
      background: transparent;
      border: 1px solid #2A2A2A;
      color: #EDEDED;
      font: inherit;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    .tg-ghost:hover {
      border-color: #FFFFFF;
    }

    .tg-presets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .tg-preset {
      text-align: left;
      background: transparent;
      border: 1px solid #2A2A2A;
      color: #FFFFFF;
      font: inherit;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tg-preset[aria-pressed="true"] {
      background: #161616;
      border-color: #FFFFFF;
    }

    .tg-preset-name {
      font-size: 13px;
    }

    .tg-preset-sub {
      color: #8C8C8C;
      font-size: 11px;
    }

    .tg-cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .tg-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
      background: transparent;
      border: 1px solid #2A2A2A;
      color: #EDEDED;
      font: inherit;
      padding: 6px 6px 8px;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
    }

    .tg-card:hover {
      border-color: #8C8C8C;
    }

    .tg-card[aria-pressed="true"] {
      border-color: #FFFFFF;
    }

    .tg-card-swatch {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      border-radius: 8px;
    }

    .tg-card-flower {
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }

    .tg-card-stem {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-left: -4px;
    }

    .tg-card-type {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: 18px;
      margin-left: 8px;
    }

    .tg-card-name {
      padding: 0 4px;
    }

    .tg-credit {
      margin-top: auto;
      color: #8C8C8C;
    }

    .tg-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 32px 32px;
      min-width: 0;
    }

    .tg-pcanvas {
      width: min(100%, calc(100vh - 96px));
      height: auto;
      aspect-ratio: 1 / 1;
      display: block;
      border: 1px solid #1E1E1E;
    }

    /* narrow screens: the poster on top, the panel scrolling under it */
    @media (max-width: 720px) {
      .tg-poster {
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }

      .tg-poster::before {
        content: "";
        order: -2;
        position: sticky;
        top: 0;
        flex: none;
        height: calc(60px + env(safe-area-inset-top));
        margin-bottom: calc(-60px - env(safe-area-inset-top));
        background: linear-gradient(#000 62%, rgba(0, 0, 0, 0));
        z-index: 4;
        pointer-events: none;
      }

      .tg-stage {
        order: -1;
        flex: none;
        padding: calc(64px + env(safe-area-inset-top)) 16px 12px;
      }

      .tg-pcanvas {
        width: 100%;
        max-width: 520px;
      }

      .tg-panel {
        flex: none;
        border-right: 0;
        border-top: 1px solid #1E1E1E;
        overflow: visible;
        padding: 20px 16px calc(32px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="tg-app">
    <canvas class="tg-canvas"></canvas>
    <input class="tg-input" aria-label="Type to grow a garden" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">

    <div class="tg-modes" role="group" aria-label="Mode">
      <button class="tg-mode" type="button" data-mode="type">Type</button>
      <button class="tg-mode" type="button" data-mode="poster">Poster</button>
    </div>

    <div class="tg-bar">
      <div class="tg-hints">
        <span class="tg-fine">type to grow</span><span class="tg-coarse">tap to type</span>
        <span>space cuts</span>
        <span class="tg-fine">backspace withers</span><span class="tg-coarse">⌫ withers</span>
        <span class="tg-fine">enter clears</span><span class="tg-coarse">return clears</span>
      </div>
      <div class="tg-ctrls">
        <div class="tg-pal" role="group" aria-label="Palette"></div>
        <button class="tg-btn tg-png" type="button" title="Save PNG (⌘S)">PNG</button>
        <button class="tg-btn tg-svg" type="button" title="Save SVG (⇧⌘S)">SVG</button>
      </div>
    </div>

    <div class="tg-poster" hidden>
      <div class="tg-panel">
        <div class="tg-head">
          <div class="tg-title">Poster</div>
          <div class="tg-muted tg-info"></div>
        </div>

        <div class="tg-section">
          <div class="tg-label">Words</div>
          <input class="tg-words" spellcheck="false" aria-label="Poster words">
          <button class="tg-ghost tg-regrow" type="button">Regrow garden</button>
        </div>

        <div class="tg-section">
          <div class="tg-label">Motion</div>
          <div class="tg-presets"></div>
        </div>

        <div class="tg-section">
          <div class="tg-label">Palette</div>
          <div class="tg-cards"></div>
        </div>

        <div class="tg-credit">
          After <a href="https://type-garden.vercel.app/" target="_blank" rel="noopener">Type Garden</a>
          by <a href="https://x.com/art_akshat" target="_blank" rel="noopener">Akshat Agarwal</a>
        </div>
      </div>

      <div class="tg-stage">
        <canvas class="tg-pcanvas" width="1080" height="1080"></canvas>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    const FONT = '"Playfair Display", Georgia, serif';
    // kept in the hidden field so Backspace on an empty field still reports
    const SENT = '​';
    // the SVG export pulls the face in itself, so the file renders right on its own in a browser
    const SVG_FONT_CSS = 'https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700';

    const SETTINGS = {
      boil: true, // lines redraw with a little jitter, like hand-drawn animation
      recoil: 20, // px a cut tendril springs back (0–80)
      density: 1, // 0.5–1.6: how leafy and bridged each word grows
      showHint: true // the bottom bar in the typing view
    };

    // poster loops; T is the loop length in ms
    const PRESETS = [
      { id: 'breathe', label: 'Breathe', sub: 'Slow sway · 3s', T: 3000 },
      { id: 'grow', label: 'Grow & wither', sub: 'Bloom, then back · 6s', T: 6000 },
      { id: 'typed', label: 'Typed', sub: 'Type, cut, repeat · 5s', T: 5000 }
    ];

    // name, background, flower, stem & leaf, flower line, type
    const PALETTES = [
      ['Rose noir', '#000000', '#FF1400', '#3257FF', '#FFB4A8', '#FFFFFF'],
      ['Paper', '#F3EEE4', '#FF3B1F', '#1C2B8F', '#FFD2C4', '#111111'],
      ['Midnight', '#0D1B4C', '#FF5A4E', '#9FB4FF', '#FFD6CF', '#FFFFFF'],
      ['Citrus', '#0E1A12', '#FF8A00', '#1FA463', '#FFE2B8', '#FFF6E8'],
      ['Orchid', '#140A1F', '#E63CFF', '#2FB8A6', '#F9D1FF', '#FFFFFF'],
      ['Moss', '#133A2A', '#FFB7C5', '#7FD18B', '#FFFFFF', '#F6F1E7'],
      ['Tomato', '#FF1400', '#FFF1E0', '#0B0B0B', '#FF1400', '#000000'],
      ['Butter', '#FFE9A8', '#E4002B', '#0F5132', '#FFC2C2', '#1A1A1A'],
      ['Blush', '#FAD4D8', '#C8102E', '#274690', '#FFE3E6', '#1A1A1A'],
      ['Mono', '#000000', '#F2F2F2', '#6E6E6E', '#000000', '#FFFFFF']
    ];

    class TypeGarden {
      constructor() {
        this.state = { mode: 'type', preset: 'breathe', palette: 0, text: 'in bloom', seed: 7 };
        this.props = SETTINGS;
        const $ = s => document.querySelector(s);
        this.el = {
          app: $('.tg-app'),
          canvas: $('.tg-canvas'),
          input: $('.tg-input'),
          modes: $('.tg-modes'),
          bar: $('.tg-bar'),
          pal: $('.tg-pal'),
          poster: $('.tg-poster'),
          pcanvas: $('.tg-pcanvas'),
          info: $('.tg-info'),
          words: $('.tg-words'),
          regrow: $('.tg-regrow'),
          presets: $('.tg-presets'),
          cards: $('.tg-cards')
        };
        this.mount();
      }

      setState(patch, cb) {
        this.state = { ...this.state, ...patch };
        this.renderUI();
        if (cb) cb();
      }

      // a change that also regrows the poster
      upd(patch) {
        this.setState(patch, () => this.buildPoster());
      }

      mount() {
        this.letters = [];
        this.uid = 1;
        this.cache = {};
        this.Sd = 0;
        this.St = 0;
        this.wrapped = false;
        this.t0 = performance.now();
        this.lastKey = 0;
        this.rand = Math.random;
        this.g = this.el.canvas.getContext('2d');
        this.buildUI();

        window.addEventListener('resize', () => this.resize());
        this.resize();
        window.addEventListener('keydown', e => this.key(e));

        this.fa = {};
        this.mx = null;
        this.flies = [];
        this.perch = [];
        this.el.app.addEventListener('pointerdown', ev => this.focus(ev));
        window.addEventListener('pointermove', e => {
          this.mx = e.clientX;
          this.my = e.clientY;
        });
        document.addEventListener('pointerleave', () => {
          this.mx = null;
        });

        // ---------- phone ----------
        this.touch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
        if (this.touch) document.documentElement.setAttribute('data-touch', '');
        this.ptype = 'mouse';
        window.addEventListener('pointerdown', e => {
          this.ptype = e.pointerType || 'mouse';
        }, true);
        // roses relax when the finger lifts
        const onUp = e => {
          if (e.pointerType && e.pointerType !== 'mouse') this.mx = null;
        };
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
        this.el.app.addEventListener('click', ev => this.tapFocus(ev));

        const fld = this.el.input;
        this.iv = SENT;
        fld.value = SENT;
        fld.addEventListener('input', e => this.inputDiff(e.target));
        fld.addEventListener('compositionstart', () => {
          this.composing = true;
        });
        fld.addEventListener('compositionend', () => {
          this.composing = false;
          setTimeout(() => {
            if (!this.composing) this.inputDiff(fld);
          }, 0);
        });

        this.vv = window.visualViewport || null;
        this.vvMax = 0;
        if (this.vv && this.touch) {
          this.vv.addEventListener('resize', () => this.syncVV());
          this.vv.addEventListener('scroll', () => this.syncVV());
          this.syncVV();
        }
        if (/[?&]tgtest/.test(location.search)) window.__tg = this;

        // widths were measured with the fallback face until the web font arrives
        if (document.fonts) {
          document.fonts.load(`700 100px ${FONT}`)
            .then(() => {
              this.cache = {};
              this.layout();
              this.buildPoster();
            })
            .catch(err => console.warn('Type Garden: font did not load', err));
        }

        this.buildPoster();
        const loop = () => {
          this.raf = requestAnimationFrame(loop);
          this.frame();
        };
        loop();
        // phones wait for a tap, so the keyboard doesn't jump up on load
        if (!this.touch) setTimeout(() => this.el.input.focus({ preventScroll: true }), 50);
        this.renderUI();
      }

      // ---------- interface ----------
      buildUI() {
        this.ui = { swatches: [], presets: [], cards: [] };
        this.ui.modes = [...this.el.modes.querySelectorAll('.tg-mode')];
        this.ui.modes.forEach(b => b.addEventListener('click', () => this.pickMode(b.dataset.mode)));

        PRESETS.forEach(p => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'tg-preset';
          b.innerHTML = '<span class="tg-preset-name"></span><span class="tg-preset-sub"></span>';
          b.children[0].textContent = p.label;
          b.children[1].textContent = p.sub;
          b.addEventListener('click', () => this.upd({ preset: p.id }));
          this.el.presets.appendChild(b);
          this.ui.presets.push(b);
        });

        PALETTES.forEach(([name, bg, flower, stem, , text], i) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'tg-card';
          b.setAttribute('aria-label', name);
          b.innerHTML = [
            '<span class="tg-card-swatch">',
            '<span class="tg-card-flower"></span><span class="tg-card-stem"></span><span class="tg-card-type">Aa</span>',
            '</span>',
            '<span class="tg-card-name"></span>'
          ].join('');
          b.querySelector('.tg-card-swatch').style.background = bg;
          b.querySelector('.tg-card-flower').style.background = flower;
          b.querySelector('.tg-card-stem').style.background = stem;
          b.querySelector('.tg-card-type').style.color = text;
          b.querySelector('.tg-card-name').textContent = name;
          b.addEventListener('click', e => this.pickPalette(i, e));
          this.el.cards.appendChild(b);
          this.ui.cards.push(b);
        });

        this.el.words.addEventListener('input', e => this.upd({ text: e.target.value }));
        this.el.regrow.addEventListener('click', () => this.upd({ seed: Math.floor(Math.random() * 1e6) }));

        PALETTES.forEach(([name, bg, flower], i) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'tg-swatch';
          b.title = name;
          b.setAttribute('aria-label', name);
          b.style.background = bg;
          const dot = document.createElement('span');
          dot.className = 'tg-dot';
          dot.style.background = flower;
          b.appendChild(dot);
          b.addEventListener('click', e => this.pickPalette(i, e));
          this.el.pal.appendChild(b);
          this.ui.swatches.push(b);
        });
        document.querySelector('.tg-png').addEventListener('click', () => {
          this.savePNG();
          this.refocus();
        });
        document.querySelector('.tg-svg').addEventListener('click', () => {
          this.saveSVG();
          this.refocus();
        });
      }

      // the poster starts from whatever is typed
      pickMode(id) {
        const s = this.state;
        if (id === 'poster' && s.mode !== 'poster') {
          this.upd({ mode: 'poster', text: this.liveText() || s.text });
        } else if (id === 'type') {
          this.setState({ mode: 'type' }, () => {
            this.resize();
            this.el.input.focus({ preventScroll: true });
          });
        }
      }

      liveText() {
        return this.letters.filter(l => !l.dead).map(l => l.ch).join('').trim();
      }

      pickPalette(i, e) {
        e.stopPropagation();
        this.setState({ palette: i }, () => this.refocus());
      }

      // after a bar button, typing carries on (on phones that would pop the keyboard, so not there)
      refocus() {
        if (this.ptype === 'mouse' && this.state.mode === 'type') this.el.input.focus({ preventScroll: true });
      }

      renderUI() {
        const s = this.state;
        const isType = s.mode === 'type';
        const pc = this.pal();
        const pr = this.preset();
        this.el.app.style.background = pc.bg;
        this.el.canvas.style.display = isType ? 'block' : 'none';
        this.ui.modes.forEach(b => b.setAttribute('aria-pressed', String(s.mode === b.dataset.mode)));
        this.el.bar.hidden = !(isType && this.props.showHint);
        this.el.bar.style.color = pc.C.text;
        this.el.pal.style.background = pc.bg;
        this.ui.swatches.forEach((b, i) => {
          const on = s.palette === i;
          // ring the chosen one; outline any that would vanish into the current background
          b.style.borderColor = on ? pc.C.text : PALETTES[i][1] === pc.bg ? '#3A3A3A' : 'transparent';
          b.style.setProperty('--scale', on ? 1.1 : 1);
          b.setAttribute('aria-pressed', String(on));
        });
        this.el.poster.hidden = isType;
        this.el.info.textContent = `1:1 · ${pr.T / 1000}s loop · 30 fps`;
        if (this.el.words.value !== s.text) this.el.words.value = s.text;
        this.ui.presets.forEach((b, i) => b.setAttribute('aria-pressed', String(s.preset === PRESETS[i].id)));
        this.ui.cards.forEach((b, i) => b.setAttribute('aria-pressed', String(s.palette === i)));
      }

      // ---------- math ----------
      // hash to 0..1
      h(n) {
        const x = Math.sin(n) * 43758.5453;
        return x - Math.floor(x);
      }

      // ease-out cubic, clamped to 0..1
      eo(t) {
        if (t <= 0) return 0;
        if (t >= 1) return 1;
        return 1 - Math.pow(1 - t, 3);
      }

      // damped spring from 0 to 1, with overshoot
      spr(t, k = 7, w = 16) {
        if (t <= 0) return 0;
        return 1 - Math.exp(-t * k) * Math.cos(t * w);
      }

      // seeded generator (mulberry32), so a word's garden can be replayed
      rng(seed) {
        let s = seed | 0;
        return () => {
          s = (s + 0x6D2B79F5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // cubic bezier sampled into n + 1 points
      bez(a, b, c, d, n) {
        const P = [];
        for (let i = 0; i <= n; i++) {
          const t = i / n;
          const u = 1 - t;
          P.push([
            u * u * u * a[0] + 3 * u * u * t * b[0] + 3 * u * t * t * c[0] + t * t * t * d[0],
            u * u * u * a[1] + 3 * u * u * t * b[1] + 3 * u * t * t * c[1] + t * t * t * d[1]
          ]);
        }
        return P;
      }

      // point and heading at fraction u along a polyline
      at(P, u) {
        const n = P.length;
        const i = Math.min(n - 2, Math.max(1, Math.round(u * (n - 1))));
        return [P[i], Math.atan2(P[i + 1][1] - P[i - 1][1], P[i + 1][0] - P[i - 1][0])];
      }

      // an element's boil for frame f: [dx, dy, rotation]
      jit(id, f, amp) {
        if (!amp) return [0, 0, 0];
        return [
          (this.h(id * 1.37 + f * 7.13) * 2 - 1) * amp,
          (this.h(id * 2.71 + f * 3.11) * 2 - 1) * amp,
          (this.h(id * 5.3 + f * 1.7) * 2 - 1) * 0.035
        ];
      }

      // smooth a polyline through its midpoints with quadratic curves
      path(c, p, closed) {
        const n = p.length;
        if (n < 2) return;
        const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        if (closed) {
          const s = m(p[n - 1], p[0]);
          c.moveTo(s[0], s[1]);
          for (let i = 0; i < n; i++) {
            const q = m(p[i], p[(i + 1) % n]);
            c.quadraticCurveTo(p[i][0], p[i][1], q[0], q[1]);
          }
          c.closePath();
        } else {
          c.moveTo(p[0][0], p[0][1]);
          for (let i = 1; i < n - 1; i++) {
            const q = m(p[i], p[i + 1]);
            c.quadraticCurveTo(p[i][0], p[i][1], q[0], q[1]);
          }
          c.lineTo(p[n - 1][0], p[n - 1][1]);
        }
      }

      // the drawing calls, over a 2D context
      backend(g) {
        return {
          fill: (p, col) => {
            g.beginPath();
            this.path(g, p, true);
            g.fillStyle = col;
            g.fill();
          },
          stroke: (p, col, w) => {
            g.beginPath();
            this.path(g, p, false);
            g.strokeStyle = col;
            g.lineWidth = w;
            g.lineCap = 'round';
            g.lineJoin = 'round';
            g.stroke();
          },
          rect: (x, y, w, h, col) => {
            g.fillStyle = col;
            g.fillRect(x, y, w, h);
          },
          text: (ch, x, y, S, col) => {
            g.font = `700 ${S}px ${FONT}`;
            g.textAlign = 'center';
            g.textBaseline = 'alphabetic';
            g.fillStyle = col;
            g.fillText(ch, x, y);
          }
        };
      }

      // a wandering stem: its heading drifts with a sine wave and a steady bend
      vine(base, dir, len, amp, waves, ph, bend, n) {
        n = n || 40;
        const P = [[base[0], base[1]]];
        const step = len / n;
        let x = base[0];
        let y = base[1];
        for (let i = 1; i <= n; i++) {
          const u = i / n;
          const a = dir + bend * u + amp * Math.sin(u * Math.PI * waves + ph) * Math.min(1, u * 3);
          x += Math.cos(a) * step;
          y += Math.sin(a) * step;
          P.push([x, y]);
        }
        return P;
      }

      // finish a stem with a tightening spiral
      curl(P, sign, rad) {
        const n = P.length;
        const e = P[n - 1];
        const a = Math.atan2(e[1] - P[n - 2][1], e[0] - P[n - 2][0]);
        const c = [e[0] - Math.sin(a) * sign * rad, e[1] + Math.cos(a) * sign * rad];
        const a0 = Math.atan2(e[1] - c[1], e[0] - c[0]);
        for (let i = 1; i <= 14; i++) {
          const u = i / 14;
          const t = a0 + sign * u * Math.PI * 1.6;
          const rr = rad * (1 - 0.5 * u);
          P.push([c[0] + Math.cos(t) * rr, c[1] + Math.sin(t) * rr]);
        }
        return P;
      }

      // split a stem into runs that pass behind (0) and in front of (1) the type, sometimes with a gap
      weave(r, startLayer) {
        const cuts = [];
        const nc = 1 + Math.floor(r() * 3);
        for (let i = 0; i < nc; i++) cuts.push(0.15 + r() * 0.7);
        cuts.sort((a, b) => a - b);
        const segs = [];
        let u0 = 0;
        let layer = startLayer;
        for (const c of cuts) {
          if (c <= u0) continue;
          segs.push({ u0, u1: c, layer });
          if (r() < 0.3) {
            const g = 0.02 + r() * 0.03;
            u0 = Math.min(0.98, c + g);
          } else {
            u0 = c;
          }
          layer = 1 - layer;
        }
        segs.push({ u0, u1: 1, layer });
        return segs;
      }

      layerAt(segs, u) {
        for (const s of segs) {
          if (u >= s.u0 && u <= s.u1) return s.layer;
        }
        return segs[segs.length - 1].layer;
      }

      // ---------- layout ----------
      resize() {
        const c = this.el.canvas;
        const r = c.getBoundingClientRect();
        const d = window.devicePixelRatio || 1;
        if (!r.width) return;
        this.W = r.width;
        this.H = r.height;
        this.dpr = d;
        c.width = Math.round(r.width * d);
        c.height = Math.round(r.height * d);
        this.layout(true);
      }

      // advance width of a character at 1px type size
      mw(ch) {
        if (this.cache[ch] != null) return this.cache[ch];
        this.g.font = `700 100px ${FONT}`;
        let w = this.g.measureText(ch).width / 100;
        if (ch === ' ') w *= 1.4;
        return (this.cache[ch] = w);
      }

      // sets tx/ty/tw on letters; keeps headroom for the garden above and below the type
      layoutCore(A, W, H, prevWrapped) {
        const maxW = W * 0.8;
        const S0 = H * 0.28;
        const LH = 2.1;
        const ws = A.map(l => this.mw(l.ch));

        const words = [];
        let cur = null;
        A.forEach((l, i) => {
          if (l.ch === ' ') {
            if (cur) {
              words.push(cur);
              cur = null;
            }
            words.push({ sp: true, idx: [i] });
          } else {
            if (!cur) cur = { idx: [] };
            cur.idx.push(i);
          }
        });
        if (cur) words.push(cur);

        // a line's width in px, not counting trailing spaces
        const lineW = (li, S) => {
          let e = li.length;
          while (e > 0 && A[li[e - 1]].ch === ' ') e--;
          let w = 0;
          for (let k = 0; k < e; k++) w += ws[li[k]];
          return w * S;
        };
        const wrap = S => {
          const lines = [[]];
          let lw = 0;
          for (const w of words) {
            const ww = w.idx.reduce((s, i) => s + ws[i], 0) * S;
            if (!w.sp && lw > 0 && lw + ww > maxW) {
              lines.push([]);
              lw = 0;
            }
            lines[lines.length - 1].push(...w.idx);
            lw += ww;
          }
          return lines;
        };

        let lines = [A.map((_, i) => i)];
        const unit = lineW(lines[0], 1);
        let S = unit > 0 ? Math.min(S0, maxW / unit) : S0;
        const multi = words.filter(w => !w.sp).length > 1;
        // wrap once a single line would get too small; the higher bar to unwrap stops it flickering
        let wrapped = multi && (S < H * 0.1 || (prevWrapped && S < H * 0.14));
        if (wrapped) {
          // largest size whose wrapped lines all fit
          let lo = H * 0.03;
          let hi = H * 0.15;
          for (let k = 0; k < 22; k++) {
            const mid = (lo + hi) / 2;
            const ls = wrap(mid);
            const ok = ls.every(li => lineW(li, mid) <= maxW) && ls.length * LH * mid <= H * 0.82;
            if (ok) lo = mid;
            else hi = mid;
          }
          S = lo;
          lines = wrap(S);
          if (lines.length < 2) wrapped = false;
        }

        const n = lines.length;
        const lh = LH * S;
        lines.forEach((li, k) => {
          let x = W / 2 - lineW(li, S) / 2;
          const y = H / 2 + (k - (n - 1) / 2) * lh + 0.33 * S;
          li.forEach(i => {
            const l = A[i];
            const w = ws[i] * S;
            l.tx = x + w / 2;
            l.ty = y;
            l.tw = w;
            l.line = k;
            x += w;
          });
        });
        return { S, wrapped, n };
      }

      // new targets for every living letter; snap skips the glide (first paint, resize)
      layout(snap) {
        if (!this.W) return;
        const A = this.letters.filter(l => !l.dead);
        const res = this.layoutCore(A, this.W, this.H, this.wrapped);
        this.wrapped = res.wrapped;
        A.forEach(l => {
          if (l.x == null) {
            l.x = l.tx;
            l.y = l.ty;
          }
        });
        const S = res.S;
        const last = A[A.length - 1];
        this.St = S;
        this.caretTX = last ? last.tx + last.tw / 2 + 0.07 * S : this.W / 2;
        this.caretTY = last ? last.ty - 0.33 * S : this.H / 2;
        if (snap || !this.Sd) {
          this.Sd = S;
          this.caretX = this.caretTX;
          this.caretY = this.caretTY;
          A.forEach(l => {
            l.x = l.tx;
            l.y = l.ty;
          });
        }
      }

      // ---------- input ----------
      // pointer down anywhere keeps the field focused; on the garden it also calls a butterfly
      focus(ev) {
        if (this.state.mode !== 'type') return;
        const touch = ev.pointerType && ev.pointerType !== 'mouse';
        const onCanvas = ev.target === this.el.canvas;
        if (touch) {
          // leave focus (and the keyboard) where it is while tapping; the tap's click opens the keyboard
          if (ev.cancelable && (onCanvas || (ev.target.closest && ev.target.closest('button')))) ev.preventDefault();
        } else {
          this.el.input.focus({ preventScroll: true });
        }
        if (onCanvas) this.spawnFly(ev.clientX, ev.clientY);
      }

      tapFocus(ev) {
        if (this.state.mode === 'type' && this.ptype !== 'mouse' && ev.target === this.el.canvas) {
          this.el.input.focus({ preventScroll: true });
        }
      }

      // phone keyboards often skip real key events and write into the field instead, rewriting whole words
      // while they predict: mirror the field and apply the difference, new letters grow and removed ones wither
      inputDiff(el) {
        if (this.state.mode !== 'type' || this._kd) {
          this.iv = this.composing ? el.value : SENT;
          if (!this.composing) el.value = SENT;
          return;
        }
        const old = this.iv == null ? SENT : this.iv;
        const cur = el.value;
        let p = 0;
        while (p < old.length && p < cur.length && old[p] === cur[p]) p++;
        let dels = old.length - p;
        // the sentinel is not a letter
        if (p === 0 && old[0] === SENT && old.length > 1) dels -= 1;
        const now = performance.now();
        this.lastKey = now;
        for (let i = 0; i < dels; i++) this.wither(now);
        for (const ch of cur.slice(p)) {
          if (ch === SENT) continue;
          if (ch.charCodeAt(0) === 10) this.clear();
          else this.add(ch, now);
        }
        if (this.composing) {
          this.iv = cur;
        } else {
          el.value = SENT;
          this.iv = SENT;
        }
      }

      // keep the app inside the visible area as the keyboard comes and goes
      syncVV() {
        const vv = this.vv;
        if (!vv) return;
        const w = Math.round(vv.width);
        if (this.vvW !== w) {
          // rotated: measure again
          this.vvW = w;
          this.vvMax = 0;
        }
        this.vvMax = Math.max(this.vvMax, vv.height);
        const kb = this.vvMax - vv.height > 120;
        const de = document.documentElement;
        de.style.setProperty('--tg-top', vv.offsetTop + 'px');
        de.style.setProperty('--tg-h', vv.height + 'px');
        if (kb) de.setAttribute('data-kb', '');
        else de.removeAttribute('data-kb');
        // keyboard put away while the field kept focus (Android back gesture): let go, so the next tap brings it back
        if (!kb && this.kbWas && document.activeElement === this.el.input) this.el.input.blur();
        this.kbWas = kb;
        this.resize();
      }

      key(e) {
        if (this.state.mode !== 'type') return;
        if (e.metaKey || e.ctrlKey || e.altKey) {
          if ((e.metaKey || e.ctrlKey) && e.key && e.key.toLowerCase() === 's') {
            e.preventDefault();
            if (e.shiftKey) this.saveSVG();
            else this.savePNG();
          }
          return;
        }
        if (e.target && e.target.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
        const now = performance.now();
        if (e.key === 'Backspace') {
          e.preventDefault();
          this.mark();
          this.wither(now);
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          this.mark();
          this.clear();
          return;
        }
        if (!e.key || e.key.length !== 1) return;
        e.preventDefault();
        this.mark();
        this.add(e.key, now);
      }

      // a real key event arrived; the field's own input event for the same key is ignored
      mark() {
        this.lastKey = performance.now();
        this._kd = true;
        setTimeout(() => {
          this._kd = false;
        }, 0);
      }

      add(ch, now) {
        const A = this.letters.filter(l => !l.dead);
        const last = A[A.length - 1];
        if (ch === ' ') {
          // space cuts the word: its last letter gets a bouquet and its tendril recoils
          if (last && last.ch !== ' ') {
            last.cut = now;
            this.genEnd(last, now - last.birth);
          }
          this.letters.push({ ch: ' ', id: this.uid++, birth: now, els: [] });
          this.layout();
          return;
        }
        // letters of one word share a seed (ws) and know their place in it (wi)
        const same = last && last.ch !== ' ';
        const l = {
          ch,
          id: this.uid++,
          birth: now,
          tb: now,
          ws: same ? last.ws : Math.floor(this.rand() * 1e9),
          wi: same ? last.wi + 1 : 0,
          prev: same ? last : null
        };
        this.gen(l);
        this.letters.push(l);
        this.layout();
      }

      wither(now) {
        const A = this.letters.filter(l => !l.dead);
        const last = A[A.length - 1];
        if (!last) return;
        last.dead = now;
        // the letter before ends the word again: its bouquet goes and its tendril regrows
        const pv = A[A.length - 2];
        if (pv && pv.ch !== ' ') {
          pv.cut = null;
          pv.endEls = null;
          pv.tb = now;
        }
        this.layout();
      }

      clear() {
        this.letters = [];
        this.layout();
      }

      // ---------- growth ----------
      // Garden coordinates are in type-size units around the letter's baseline centre, so a letter's
      // garden scales and travels with it.

      // the character of a word's garden, the same for all its letters
      wordParams(ws) {
        const r = this.rng(ws * 7 + 13);
        const dens = this.props.density;
        return {
          roseP: 0.3 + r() * 0.3,
          leafy: (0.6 + r() * 0.8) * dens,
          dens,
          lean: (r() - 0.5) * 0.6,
          big: 0.85 + r() * 0.45,
          curvy: 0.8 + r() * 0.6,
          bridgeP: Math.min(0.95, (0.45 + r() * 0.35) * dens),
          w: 0.5
        };
      }

      // one stem with its leaves, its tip (rose, fan, leaf or curl) and maybe one side branch
      grow(r, E, nid, p, o) {
        const tip = o.tip || (r() < p.roseP ? 'rose' : r() < 0.45 ? 'fan' : r() < 0.6 ? 'leaf' : 'curl');
        let P = o.pts || this.vine(o.base, o.dir, o.len, (0.35 + r() * 0.45) * p.curvy, 1 + r() * 1.6, r() * 6.28, (r() - 0.5) * 1.2, 40);
        if (tip === 'curl') P = this.curl(P, r() < 0.5 ? -1 : 1, 0.05 + r() * 0.05);
        const segs = this.weave(r, o.layer0 != null ? o.layer0 : (r() < 0.5 ? 0 : 1));
        const dur = Math.max(320, (o.len || 0.8) * 620);
        const thorns = [];
        const nt = Math.floor(r() * 2.5);
        for (let i = 0; i < nt; i++) thorns.push({ u: 0.15 + r() * 0.65, s: r() < 0.5 ? -1 : 1 });
        E.push({ t: 'stem', id: nid(), pts: P, segs, d0: o.d0, dur, w: o.depth ? 0.82 : 1, thorns });

        const nl = Math.floor(r() * 2.8 * p.leafy);
        let sd = r() < 0.5 ? -1 : 1;
        for (let i = 0; i < nl; i++) {
          const u = 0.25 + r() * 0.6;
          const [q, a] = this.at(P, u);
          sd = -sd;
          E.push({
            t: 'leaf',
            id: nid(),
            x: q[0],
            y: q[1],
            a: a + sd * (0.55 + r() * 0.5),
            L: (0.14 + r() * 0.2) * (o.depth ? 0.8 : 1),
            bend: (r() - 0.5) * 1.2,
            layer: this.layerAt(segs, u),
            d0: o.d0 + dur * u
          });
        }

        const [tp, ta] = this.at(P, 1);
        const td = o.d0 + dur * 0.8;
        const tl = this.layerAt(segs, 1);
        if (tip === 'rose') {
          const R = (0.13 + r() * 0.15) * p.big * (o.depth ? 0.75 : 1);
          // legibility: a rose sitting over the letter body mostly goes behind it
          const over = tp[1] > -0.78 && tp[1] < 0.05 && Math.abs(tp[0]) < p.w * 0.5;
          const layer = over ? (r() < 0.22 ? 1 : 0) : (r() < 0.6 ? 1 : tl);
          E.push({
            t: 'rose',
            id: nid(),
            x: tp[0],
            y: tp[1],
            R,
            rot: (r() - 0.5) * 1.0,
            ph1: r() * 6.28,
            ph2: r() * 6.28,
            turns: 1.8 + r() * 1,
            layer,
            d0: td
          });
          if (r() < 0.2) {
            // a smaller second bloom beside the first
            const oo = ta + (r() < 0.5 ? 1 : -1) * 1.3;
            E.push({
              t: 'rose',
              id: nid(),
              x: tp[0] + Math.cos(oo) * R * 1.4,
              y: tp[1] + Math.sin(oo) * R * 1.4,
              R: R * (0.6 + r() * 0.3),
              rot: (r() - 0.5) * 1.2,
              ph1: r() * 6.28,
              ph2: r() * 6.28,
              turns: 1.8 + r(),
              layer,
              d0: td + 120
            });
          }
        } else if (tip === 'fan') {
          const spread = 0.6 + r() * 0.3;
          for (let j = 0; j < 2; j++) {
            E.push({ t: 'leaf', id: nid(), x: tp[0], y: tp[1], a: ta + (j - 0.5) * spread, L: 0.2 + r() * 0.2, bend: (j - 0.5) * 0.8, layer: tl, d0: td + j * 60 });
          }
        } else if (tip === 'leaf') {
          E.push({ t: 'leaf', id: nid(), x: tp[0], y: tp[1], a: ta + (r() - 0.5) * 0.3, L: 0.16 + r() * 0.16, bend: r() - 0.5, layer: tl, d0: td });
        }

        if (!o.depth && r() < 0.3) {
          const u = 0.35 + r() * 0.35;
          const [q, a] = this.at(P, u);
          this.grow(r, E, nid, p, {
            base: q,
            dir: a + (r() < 0.5 ? -1 : 1) * (0.7 + r() * 0.4),
            len: (o.len || 0.8) * (0.35 + r() * 0.2),
            d0: o.d0 + dur * u,
            depth: 1,
            layer0: this.layerAt(segs, u)
          });
        }
        return P;
      }

      // a letter's garden: stems up, sometimes one down, a bridge back to the previous letter, a curl off
      // the front of each word, and a tendril kept aside that shows while this letter ends its word
      gen(l) {
        const r = this.rng((l.ws ^ Math.imul(l.wi + 1, 2654435761)) + Math.floor(this.rand() * 1e6));
        const p = this.wordParams(l.ws);
        const E = [];
        let k0 = 0;
        const nid = () => l.id * 100 + (k0++);
        const w = this.mw(l.ch);
        const inX = () => (r() - 0.5) * w * 0.7;
        p.w = w;

        const nUp = 1 + (r() < 0.45 * p.dens ? 1 : 0);
        for (let i = 0; i < nUp; i++) {
          this.grow(r, E, nid, p, {
            base: [inX(), -r() * 0.3],
            dir: -Math.PI / 2 + p.lean * 0.5 + (r() - 0.5) * 0.7,
            len: 0.6 + r() * 0.5,
            d0: 40 + i * 130,
            tip: l.wi === 0 && i === 0 ? 'rose' : null
          });
        }
        if (r() < 0.4 * p.dens) {
          this.grow(r, E, nid, p, {
            base: [inX(), -0.1 - r() * 0.35],
            dir: Math.PI / 2 + (r() - 0.5) * 0.8,
            len: 0.35 + r() * 0.35,
            d0: 160
          });
        }
        if (l.prev && r() < p.bridgeP) {
          const px = -(this.mw(l.prev.ch) + w) / 2;
          const a = [inX(), -0.05 - r() * 0.55];
          const b = [px + (r() - 0.5) * 0.25, -0.05 - r() * 0.55];
          const bulge = (r() < 0.55 ? -1 : 1) * (0.4 + r() * 0.4);
          const dx = b[0] - a[0];
          let P = this.bez(a, [a[0] + dx * 0.15, a[1] + bulge], [b[0] - dx * 0.15, b[1] + bulge * 0.9], b, 40);
          if (r() < 0.45) P = P.slice(0, Math.floor(P.length * (0.7 + r() * 0.2)));
          this.grow(r, E, nid, p, {
            pts: P,
            len: Math.abs(dx) + Math.abs(bulge),
            d0: 90,
            tip: r() < 0.5 ? 'curl' : r() < 0.5 ? 'leaf' : 'rose'
          });
        }
        if (l.wi === 0) {
          this.grow(r, E, nid, p, {
            base: [-w * 0.3, -0.15 - r() * 0.4],
            dir: Math.PI + (r() - 0.5) * 1.2,
            len: 0.45 + r() * 0.3,
            d0: 120,
            tip: 'curl'
          });
        }
        l.els = E;
        l.endEls = null;

        const T = [];
        const tr = this.rng(l.id * 977 + Math.floor(this.rand() * 1e6));
        this.grow(tr, T, () => l.id * 100 + 90 + T.length, p, {
          base: [w * 0.25, -0.1 - tr() * 0.45],
          dir: (tr() - 0.5) * 1.4,
          len: 0.45 + tr() * 0.25,
          d0: 0,
          tip: 'curl',
          depth: 1
        });
        l.tend = T.filter(e => e.t === 'stem').slice(0, 1);
      }

      // the bouquet a word's last letter gets when space cuts it, starting rel ms into its life
      genEnd(l, rel) {
        const r = this.rng(l.ws + l.wi * 31 + Math.floor(this.rand() * 1e6));
        const p = this.wordParams(l.ws);
        const E = [];
        let k0 = 50;
        const nid = () => l.id * 100 + (k0++);
        const w = this.mw(l.ch);
        const n = 1 + Math.floor(r() * 2.5);
        p.w = w;
        for (let i = 0; i < n; i++) {
          const dir = -Math.PI / 2 + 0.6 + (i - (n - 1) / 2) * 0.9 + (r() - 0.5) * 0.4;
          this.grow(r, E, nid, p, {
            base: [(r() - 0.2) * w * 0.6, -r() * 0.5],
            dir,
            len: 0.4 + r() * 0.45,
            d0: rel + 40 + i * 90,
            depth: 1,
            tip: i === 0 || r() < 0.5 ? 'rose' : 'fan'
          });
        }
        l.endEls = E;
      }

      // ---------- drawing ----------
      // stroke the stretch of polyline P between fractions a and b
      strokeRange(B, P, a, b, col, w) {
        const n = P.length - 1;
        const ia = a * n;
        const ib = b * n;
        const lerp = t => {
          const i = Math.min(n - 1, Math.floor(t));
          const f = t - i;
          return [P[i][0] + (P[i + 1][0] - P[i][0]) * f, P[i][1] + (P[i + 1][1] - P[i][1]) * f];
        };
        const pts = [lerp(ia)];
        for (let i = Math.floor(ia) + 1; i < ib; i++) pts.push(P[i]);
        pts.push(lerp(ib));
        if (pts.length >= 2) B.stroke(pts, col, w);
      }

      thorn(B, P, u, s, S) {
        const [p, a] = this.at(P, u);
        const d = a + s * 2.3;
        const L = S * 0.045;
        B.stroke([p, [p[0] + Math.cos(d) * L, p[1] + Math.sin(d) * L]], this.cc.blue, S * 0.022);
      }

      // a leaf of length L from (bx, by) at angle a, its midrib bowed by bend, with a vein once it is big enough
      leaf(B, bx, by, a, L, bend) {
        if (L < 0.5) return;
        const ca = Math.cos(a);
        const sa = Math.sin(a);
        const px = -sa;
        const py = ca;
        const ax = u => {
          const b = Math.sin(Math.PI * u) * bend * 0.15 * L;
          return [bx + ca * u * L + px * b, by + sa * u * L + py * b];
        };
        const hw = u => L * 0.18 * Math.sin(Math.PI * Math.pow(u, 0.8));
        const N = 12;
        const s1 = [];
        const s2 = [];
        for (let i = 0; i <= N; i++) {
          const u = i / N;
          const c = ax(u);
          const w = hw(u);
          s1.push([c[0] + px * w, c[1] + py * w]);
          s2.push([c[0] - px * w, c[1] - py * w]);
        }
        const tip = ax(1);
        const base = ax(0);
        B.fill([base, ...s1.slice(1, N), tip, tip, ...s2.slice(1, N).reverse(), base], this.cc.blue);
        if (L > 6) {
          const v = [];
          for (let i = 0; i <= 8; i++) v.push(ax(0.08 + 0.72 * i / 8));
          B.stroke(v, this.cc.vein, Math.max(0.8, L * 0.03));
        }
      }

      // a rose of radius R, a ms after it started blooming: six petals spring open back to front, then the
      // spiral at its heart and the scalloped lip draw in. tl turns its face: the bloom squashes along that
      // direction and its raised parts (z) shift toward it
      rose(B, cx, cy, R, rot, e, a, tl) {
        const cr = Math.cos(rot);
        const sr = Math.sin(rot);
        const tm = tl ? Math.hypot(tl[0], tl[1]) : 0;
        const ux = tm ? tl[0] / tm : 0;
        const uy = tm ? tl[1] / tm : 0;
        const sq = -0.28 * tm;
        const T = (x, y, z = 0) => {
          let dx = x * cr - y * sr;
          let dy = x * sr + y * cr;
          if (tm) {
            const k = (dx * ux + dy * uy) * sq;
            dx += k * ux + tl[0] * R * z;
            dy += k * uy + tl[1] * R * z;
          }
          return [cx + dx, cy + dy];
        };
        // petals, back to front: [cx, cy, rx, ry, angle, depth, edge]
        const P = [
          [0, -0.36, 0.56, 0.54, 0, 0, 0],
          [-0.5, -0.06, 0.6, 0.6, -0.35, 0, 0],
          [0.52, -0.06, 0.6, 0.6, 0.35, 0, 0],
          [-0.42, 0.3, 0.62, 0.48, 0.2, 0.12, 1],
          [0.47, 0.3, 0.62, 0.48, -0.2, 0.12, 1],
          [0.05, 0.42, 0.56, 0.38, 0, 0.14, 0]
        ];
        // petals unfold from the base of the cup
        const ax0 = 0;
        const ay0 = 0.5;
        const lw = Math.max(0.8, R * 0.045);
        const st = 85;
        P.forEach((q, i) => {
          const s = this.spr((a - i * st) / 1000, 8, 14);
          if (s <= 0.001) return;
          const open = (1 - Math.min(1, s)) * (q[0] < 0 ? 0.5 : -0.5);
          const ang = q[4] + open;
          const ca = Math.cos(ang);
          const sa = Math.sin(ang);
          const pt = th => {
            const rr = 1 + 0.08 * Math.sin(3 * th + e.ph1 + i) + 0.04 * Math.sin(5 * th + e.ph2);
            const lx = Math.cos(th) * q[2] * rr;
            const ly = Math.sin(th) * q[3] * rr;
            const px = q[0] + lx * ca - ly * sa;
            const py = q[1] + lx * sa + ly * ca;
            return T((ax0 + (px - ax0) * s) * R, (ay0 + (py - ay0) * s) * R, q[5]);
          };
          const pts = [];
          for (let k = 0; k < 26; k++) pts.push(pt(k / 26 * Math.PI * 2));
          B.fill(pts, this.cc.red);
          // the two front petals get an inked rim
          if (q[6] && R >= 12 && s > 0.4) {
            const arc = [];
            for (let k = 0; k <= 14; k++) arc.push(pt(Math.PI * (1.18 + 0.64 * k / 14)));
            this.strokeRange(B, arc, 0, Math.min(1, (s - 0.4) / 0.5), this.cc.line, lw * 0.8);
          }
        });
        const fr = this.eo((a - P.length * st - 80) / 520);
        if (fr > 0 && R > 3) {
          const sp = [];
          const scl = [];
          // small roses get fewer turns so the spiral does not clot
          const turns = R < 20 ? Math.min(e.turns, 1.3) : R < 32 ? e.turns * 0.8 : e.turns;
          for (let i = 0; i <= 70; i++) {
            const u = i / 70;
            const th = e.ph1 + u * turns * Math.PI * 2;
            const rr = R * (0.08 + 0.57 * u);
            sp.push(T(Math.cos(th) * rr * 1.05, Math.sin(th) * rr * 0.72 - 0.12 * R, 0.34 - 0.24 * u));
          }
          this.strokeRange(B, sp, 0, fr, this.cc.line, lw);
          if (R >= 14) {
            for (let i = 0; i <= 36; i++) {
              const u = i / 36;
              scl.push(T((-0.72 + 1.5 * u) * R, 0.36 * R + 0.16 * R * Math.abs(Math.sin(u * Math.PI * 3)), 0.18));
            }
            this.strokeRange(B, scl, 0, fr, this.cc.line, lw);
          }
        }
      }

      // ---------- butterflies ----------
      // a butterfly flies in from the nearer side and settles on the free rose closest to the click;
      // with no rose open it wanders about the click for a few seconds, then leaves
      spawnFly(cx, cy) {
        if (this.flies.length >= 6) {
          const o = this.flies.find(f => f.st !== 'leave');
          if (o) this.flyOff(o);
        }
        const taken = new Set(this.flies.filter(f => f.st !== 'leave').map(f => f.pid));
        let best = null;
        let bd = 1e9;
        for (const p of this.perch) {
          if (taken.has(p.id)) continue;
          const d = Math.hypot(p.x - cx, p.y - cy);
          if (d < bd) {
            bd = d;
            best = p;
          }
        }
        const left = cx < this.W / 2;
        const sz = Math.max(9, this.Sd * 0.09);
        this.flies.push({
          x: left ? -40 : this.W + 40,
          y: cy + (Math.random() - 0.5) * this.H * 0.4,
          vx: 0,
          vy: 0,
          st: best ? 'fly' : 'wander',
          pid: best ? best.id : null,
          hx: cx,
          hy: cy,
          t0: performance.now(),
          ph: Math.random() * 6,
          sz,
          seed: Math.random() * 100,
          ang: 0
        });
      }

      flyOff(f) {
        f.st = 'leave';
        f.pid = null;
        f.ex = f.x < this.W / 2 ? -80 : this.W + 80;
        f.ey = f.y - this.H * 0.3;
      }

      drawFlies(B, now, C) {
        const dt = Math.min(48, now - (this._fl || now));
        this._fl = now;
        const byId = {};
        for (const p of this.perch) byId[p.id] = p;
        this.flies = this.flies.filter(f => {
          const t = (now - f.t0) / 1000;
          let tx;
          let ty;
          if (f.st === 'sit' || f.st === 'fly') {
            const p = byId[f.pid];
            if (!p) {
              // its rose withered
              this.flyOff(f);
            } else {
              tx = p.x + p.R * 0.05;
              ty = p.y - p.R * 0.55;
            }
          }
          if (f.st === 'wander') {
            tx = f.hx + Math.sin(t * 1.3 + f.seed) * 70;
            ty = f.hy + Math.sin(t * 2.1 + f.seed) * 40;
            if (t > 3.5) this.flyOff(f);
          }
          if (f.st === 'leave') {
            tx = f.ex;
            ty = f.ey;
          }
          if (f.st === 'sit') {
            f.x += (tx - f.x) * 0.35;
            f.y += (ty - f.y) * 0.35;
            f.ang *= 0.85;
            f.ph += dt * 0.004;
            // wings mostly rest, with the odd burst of flapping
            const burst = Math.sin(now / 1000 * 0.9 + f.seed) > 0.75;
            f.open = burst ? 0.2 + 0.8 * Math.abs(Math.cos(now / 1000 * 9 + f.seed)) : 0.25 + 0.15 * Math.sin(f.ph);
          } else {
            // steer toward the target with flutter and wobble, banking with horizontal speed
            const dx = tx - f.x;
            const dy = ty - f.y;
            const d = Math.hypot(dx, dy) || 1;
            const sp = f.st === 'leave' ? 0.42 : Math.min(0.34, 0.06 + d * 0.0016);
            const flut = Math.sin(t * 7 + f.seed) * 0.12;
            const wob = Math.cos(t * 4.3 + f.seed) * 0.1;
            const ax = (dx / d * sp + wob) - f.vx;
            const ay = (dy / d * sp + flut) - f.vy;
            f.vx += ax * 0.06 * dt / 16;
            f.vy += ay * 0.06 * dt / 16;
            f.x += f.vx * dt;
            f.y += f.vy * dt + Math.sin(t * 13 + f.seed) * 0.6;
            f.ang += (Math.max(-0.5, Math.min(0.5, f.vx * 1.4)) - f.ang) * 0.1;
            f.open = Math.abs(Math.cos(t * 17 + f.seed));
            if (f.st === 'fly' && d < 5) {
              f.st = 'sit';
              f.ph = 0;
            }
            if (f.st === 'leave' && (f.x < -60 || f.x > this.W + 60 || f.y < -60)) return false;
          }
          this.butterfly(B, f.x, f.y, f.sz, f.ang, f.open, C);
          return true;
        });
      }

      // a butterfly of size s at (x, y), tilted by ang, wings open by o (0 folded .. 1 flat)
      butterfly(B, x, y, s, ang, o, C) {
        const ca = Math.cos(ang);
        const sa = Math.sin(ang);
        const T = (px, py) => [x + (px * ca - py * sa) * s, y + (px * sa + py * ca) * s];
        const wing = (cx, cy, rx, ry, a, side) => {
          const pts = [];
          const c = Math.cos(a);
          const sn = Math.sin(a);
          for (let k = 0; k < 22; k++) {
            const th = k / 22 * Math.PI * 2;
            const r = 1 + 0.08 * Math.sin(th * 3);
            const lx = Math.cos(th) * rx * r;
            const ly = Math.sin(th) * ry * r;
            pts.push(T(side * (cx + lx * c - ly * sn) * (0.12 + 0.88 * o), cy + lx * sn + ly * c));
          }
          return pts;
        };
        for (const sd of [-1, 1]) {
          B.fill(wing(0.46, 0.28, 0.36, 0.3, 0.5, sd), C.text);
          B.fill(wing(0.55, -0.32, 0.55, 0.36, -0.55, sd), C.text);
          if (o > 0.35) B.fill(wing(0.66, -0.4, 0.13, 0.11, 0, sd), C.red);
        }
        const body = [];
        for (let k = 0; k < 18; k++) {
          const th = k / 18 * Math.PI * 2;
          body.push(T(Math.cos(th) * 0.08, Math.sin(th) * 0.48));
        }
        B.fill(body, C.blue);
        const lw = Math.max(0.8, s * 0.05);
        B.stroke([T(0, -0.42), T(-0.14, -0.72), T(-0.24, -0.86)], C.blue, lw);
        B.stroke([T(0, -0.42), T(0.14, -0.72), T(0.24, -0.86)], C.blue, lw);
      }

      // ---------- render ----------
      frame() {
        const now = performance.now();
        const dt = Math.min(64, now - (this.lt || now));
        this.lt = now;
        if (this.state.mode === 'poster') {
          this.posterDraw(this.el.pcanvas.getContext('2d'), now - (this.pt0 || 0));
          return;
        }
        // everything glides to its new place with the same time constant
        const k = 1 - Math.exp(-dt / 80);
        this.Sd += (this.St - this.Sd) * k;
        this.caretX += (this.caretTX - this.caretX) * k;
        this.caretY += (this.caretTY - this.caretY) * k;
        for (const l of this.letters) {
          if (!l.dead && l.tx != null) {
            l.x += (l.tx - l.x) * k;
            l.y += (l.ty - l.y) * k;
          }
        }
        this.letters = this.letters.filter(l => !(l.dead && now - l.dead > 300));
        this.paint(now, true);
      }

      pal() {
        const p = PALETTES[this.state.palette] || PALETTES[0];
        return { bg: p[1], C: { red: p[2], blue: p[3], line: p[4], text: p[5], vein: p[1] } };
      }

      paint(now, caret) {
        const g = this.g;
        const d = this.dpr;
        const C = this.pal().C;
        g.setTransform(d, 0, 0, d, 0, 0);
        g.fillStyle = this.pal().bg;
        g.fillRect(0, 0, this.W, this.H);
        const B = this.backend(g);
        const st = this.mainState();
        this.render(B, now, st);
        this.drawFlies(B, now, st.C);
        if (caret) {
          // solid while typing, blinking when idle; grows in on first load
          const S = this.Sd;
          const on = now - this.lastKey < 500 || Math.floor(now / 530) % 2 === 0;
          const hf = this.eo((now - this.t0) / 600);
          if (on && hf > 0) {
            const h = 0.8 * S * hf;
            const w = Math.max(2, S * 0.03);
            B.rect(this.caretX - w / 2, this.caretY - h / 2, w, h, C.text);
          }
        }
      }

      mainState() {
        return { letters: this.letters, S: this.Sd, C: this.pal().C, boil: this.props.boil, recoil: this.props.recoil, speed: 1, wither: 260, face: true };
      }

      // the pointer the garden leans toward, if any
      near() {
        return this.mx != null ? [this.mx, this.my] : null;
      }

      // a rose turns its face toward the pointer, eased per rose
      faceTurn(e, x, y) {
        let wx = 0;
        let wy = 0;
        const A = this.near(x, y);
        if (A) {
          const dx = A[0] - x;
          const dy = A[1] - y;
          const d = Math.hypot(dx, dy);
          const reach = 300;
          if (d < reach && d > 0.001) {
            const w = 1 - d / reach;
            const s = w * w * (3 - 2 * w) * Math.min(1, d / 40);
            wx = dx / d * s;
            wy = dy / d * s;
          }
        }
        const c = this.fa[e.id] || [0, 0];
        c[0] += (wx - c[0]) * 0.09;
        c[1] += (wy - c[1]) * 0.09;
        this.fa[e.id] = c;
        return c;
      }

      // garden behind the type, the type, then the garden in front of it. Shared by the typing view, the
      // poster and the SVG export; st carries what differs (size, palette, speed, warps)
      render(B, now, st) {
        const S = st.S;
        const L = st.letters;
        const act = L.filter(l => !l.dead);
        const sp = st.speed || 1;
        this.cc = st.C;
        this._now = now;
        if (st.face) this.perch = [];
        // each letter's garden leans toward the pointer, eased
        if (st.face) {
          for (const l of L) {
            let tx = 0;
            let ty = 0;
            const A = !l.dead && l.ch !== ' ' ? this.near(l.x, l.y - S * 0.6) : null;
            if (A) {
              const dx = A[0] - l.x;
              const dy = A[1] - (l.y - S * 0.6);
              const d = Math.hypot(dx, dy);
              const reach = Math.max(260, S * 3.2);
              if (d < reach && d > 1) {
                const w = 1 - d / reach;
                const s = w * w * (3 - 2 * w);
                tx = dx / d * s;
                ty = dy / d * s;
              }
            }
            const c = l.lean || (l.lean = [0, 0]);
            c[0] += (tx - c[0]) * 0.07;
            c[1] += (ty - c[1]) * 0.07;
          }
        }
        // the boil steps about eight times a second
        const f = st.boil ? Math.floor(now / 120) : 0;
        const amp = st.boil ? Math.max(0.8, S * 0.01) : 0;
        const kd = l => (l.dead ? 1 - this.eo((now - l.dead) / st.wither) : 1);
        const draw = layer => {
          for (const l of L) {
            if (l.ch === ' ' || !l.els) continue;
            const age = (now - l.birth) * sp;
            const kk = kd(l);
            const each = e => {
              if (e.t === 'stem') this.drawStem(B, e, l, age, kk, st, f, amp, layer);
              else if (e.layer === layer) this.drawEl(B, e, l, age, kk, st, f, amp);
            };
            l.els.forEach(each);
            if (l.endEls) l.endEls.forEach(each);
            // the tendril reaches out only from a word's last letter, and springs back when space cuts it
            const i = act.indexOf(l);
            const nx = i >= 0 ? act[i + 1] : null;
            if (l.tend && (l.dead || !nx || nx.ch === ' ')) {
              let fr = this.eo(((now - l.tb) * sp - 150) / 450);
              if (l.cut != null) fr *= 1 - this.eo((now - l.cut) * sp / 150) * Math.min(0.85, st.recoil / (0.6 * S));
              for (const e of l.tend) this.drawStem(B, e, l, age, kk, st, f, amp, layer, fr * kk);
            }
          }
        };
        draw(0);
        for (const l of L) {
          if (l.ch !== ' ' && (st.textAll || !l.dead)) B.text(l.ch, l.x, l.y, S, st.C.text);
        }
        draw(1);
      }

      // where a garden point sits right now: a new letter's garden wobbles in and settles, the whole
      // garden leans toward the pointer (higher points move more), then any poster warp applies
      wpt(st, l, x, y) {
        if (l.birth != null && this._now != null) {
          const t = (this._now - l.birth) * (st.speed || 1) / 1000;
          if (t > 0 && t < 2.5) {
            const hh = Math.max(0, (l.y - y) / st.S);
            const dmp = Math.exp(-t * 3.2);
            const dir = l.id % 2 ? 1 : -1;
            x += st.S * 0.07 * hh * dmp * Math.sin(t * 11) * dir;
            y += st.S * 0.035 * hh * dmp * Math.sin(t * 11 + 1.2);
          }
        }
        if (st.face && l.lean) {
          const hh = Math.min(2.5, Math.max(0, (l.y - y) / st.S));
          const f = hh * hh * 0.5 + hh * 0.5;
          x += l.lean[0] * st.S * 0.1 * f;
          y += l.lean[1] * st.S * 0.05 * f;
        }
        return st.warp ? st.warp(x, y, l) : [x, y];
      }

      // frO overrides how much of the stem is grown (0..1)
      drawStem(B, e, l, age, kk, st, f, amp, layer, frO) {
        const S = st.S;
        const fr = frO != null ? frO : this.eo((age - e.d0) / e.dur) * kk;
        if (fr <= 0) return;
        const j = this.jit(e.id, f, amp);
        const P = e.pts.map(p => this.wpt(st, l, l.x + p[0] * S + j[0], l.y + p[1] * S + j[1]));
        for (const sg of e.segs) {
          if (sg.layer !== layer) continue;
          const b = Math.min(sg.u1, fr);
          if (b <= sg.u0) continue;
          this.strokeRange(B, P, sg.u0, b, st.C.blue, S * 0.022 * (e.w || 1));
        }
        for (const th of e.thorns) {
          if (fr > th.u && this.layerAt(e.segs, th.u) === layer) this.thorn(B, P, th.u, th.s, S);
        }
      }

      drawEl(B, e, l, age, kk, st, f, amp) {
        const S = st.S;
        const j = this.jit(e.id, f, amp);
        const wx = (x, y) => this.wpt(st, l, l.x + x * S + j[0], l.y + y * S + j[1]);
        const rw = st.rotw ? st.rotw(e) : 0;
        if (e.t === 'leaf') {
          const sc = this.spr((age - e.d0) / 1000, 7, 15) * kk;
          if (sc <= 0) return;
          const p = wx(e.x, e.y);
          this.leaf(B, p[0], p[1], e.a + j[2] + rw, e.L * S * sc, e.bend);
        } else if (e.t === 'rose') {
          const a = age - e.d0;
          if (a < 0 || kk <= 0.001) return;
          const p = wx(e.x, e.y);
          const tl = st.face ? this.faceTurn(e, p[0], p[1]) : null;
          // an open rose on a living letter is somewhere a butterfly can land
          if ((st.face || st.perchOn) && !l.dead && a > 700) this.perch.push({ id: e.id, x: p[0], y: p[1], R: e.R * S * kk });
          this.rose(B, p[0], p[1], e.R * S * kk, e.rot + j[2] + rw + (tl ? tl[0] * 0.22 : 0), e, a, tl);
        }
      }

      // ---------- poster ----------
      preset() {
        return PRESETS.find(p => p.id === this.state.preset) || PRESETS[0];
      }

      // grow the poster's words once from the seed, time each letter for the preset, then fit the whole
      // garden into a 1080 square
      buildPoster() {
        if (!this.g) return;
        const s = this.state;
        const pr = this.preset();
        const text = (s.text || '').slice(0, 40) || ' ';
        this.rand = this.rng(s.seed * 7919 + 1);
        const L = [];
        let prev = null;
        let uid = 1;
        for (const ch of text) {
          if (ch === ' ') {
            const sp = { ch: ' ', id: 9000 + uid++, els: [] };
            L.push(sp);
            prev = sp;
            continue;
          }
          const same = prev && prev.ch !== ' ';
          const l = {
            ch,
            id: 9000 + uid++,
            ws: same ? prev.ws : Math.floor(this.rand() * 1e9),
            wi: same ? prev.wi + 1 : 0,
            prev: same ? prev : null
          };
          this.gen(l);
          L.push(l);
          prev = l;
        }

        // b: when each letter is born; d: when it withers (last letter first)
        const n = L.length;
        const step = pr.id === 'grow' ? Math.min(110, 3000 / n) : pr.id === 'typed' ? Math.min(85, 3600 / n) : 0;
        const off = pr.id === 'grow' ? 200 : pr.id === 'typed' ? 300 : 0;
        L.forEach((l, i) => {
          l.b = off + i * step;
        });
        const wd = Math.min(60, 900 / n);
        L.forEach((l, i) => {
          l.d = 4200 + (n - 1 - i) * wd;
          const nx = L[i + 1];
          l.cutRel = null;
          if (l.ch !== ' ' && nx && nx.ch === ' ') {
            l.cutRel = Math.max(30, nx.b - l.b);
            this.genEnd(l, l.cutRel);
          }
        });
        this.rand = Math.random;
        const res = this.layoutCore(L, 1080, 1080, false);

        // bounds of the whole garden, not just the type
        const S = res.S;
        let x0 = 1e9;
        let y0 = 1e9;
        let x1 = -1e9;
        let y1 = -1e9;
        const addP = (l, x, y, r) => {
          const X = l.tx + x * S;
          const Y = l.ty + y * S;
          const R = (r || 0) * S;
          x0 = Math.min(x0, X - R);
          x1 = Math.max(x1, X + R);
          y0 = Math.min(y0, Y - R);
          y1 = Math.max(y1, Y + R);
        };
        for (const l of L) {
          if (l.ch === ' ') continue;
          addP(l, -l.tw / S / 2, -0.75);
          addP(l, l.tw / S / 2, 0.1);
          for (const e of [...l.els, ...(l.endEls || [])]) {
            if (e.t === 'stem') e.pts.forEach(q => addP(l, q[0], q[1], 0.02));
            else if (e.t === 'leaf') addP(l, e.x, e.y, e.L);
            else addP(l, e.x, e.y, e.R * 1.15);
          }
        }

        // centre on the type itself; shrink just enough for the garden to clear a 6% margin on every side
        let tx0 = 1e9;
        let tx1 = -1e9;
        let ty0 = 1e9;
        let ty1 = -1e9;
        for (const l of L) {
          if (l.ch === ' ') continue;
          tx0 = Math.min(tx0, l.tx - l.tw / 2);
          tx1 = Math.max(tx1, l.tx + l.tw / 2);
          ty0 = Math.min(ty0, l.ty - 0.72 * S);
          ty1 = Math.max(ty1, l.ty);
        }
        const Z = 1080;
        const half = Z * 0.44;
        const bcx = (tx0 + tx1) / 2;
        const bcy = (ty0 + ty1) / 2;
        const k = Math.min(1.25, half / Math.max(1, bcx - x0, x1 - bcx), half / Math.max(1, bcy - y0, y1 - bcy));
        L.forEach(l => {
          l.tx = Z / 2 + (l.tx - bcx) * k;
          l.ty = Z / 2 + (l.ty - bcy) * k;
          l.tw *= k;
          l.x = l.tx;
          l.y = l.ty;
        });
        this.P = { letters: L, S: S * k, T: pr.T, preset: pr.id };
        this.pt0 = performance.now();
      }

      // one frame of the poster loop, t ms in
      posterDraw(g, t) {
        const P = this.P;
        if (!P) return;
        const Z = 1080;
        const pc = this.pal();
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.fillStyle = pc.bg;
        g.fillRect(0, 0, Z, Z);
        const tt = ((t % P.T) + P.T) % P.T;
        const L = P.letters;
        const B = this.backend(g);
        const st = { letters: L, S: P.S, C: pc.C, boil: this.props.boil, recoil: this.props.recoil, speed: 1, wither: 600, textAll: true };
        L.forEach(l => {
          l.x = l.tx;
          l.y = l.ty;
          l.dead = null;
        });
        // replay each letter's birth (and cut) from a base time; -1e5 means long since grown
        const set = base => L.forEach(l => {
          l.birth = base + l.b;
          l.tb = l.birth;
          l.cut = l.cutRel != null ? l.birth + l.cutRel : null;
        });

        if (P.preset === 'breathe') {
          set(-1e5);
          const ph = tt / P.T * Math.PI * 2;
          const S = P.S;
          st.warp = (x, y, l) => {
            const h = Math.max(0, (l.y - y) / S);
            return [x + Math.sin(ph + l.x * 0.004 + h * 1.1) * S * 0.03 * h, y + Math.cos(ph + x * 0.003) * S * 0.008 * h];
          };
          st.rotw = e => Math.sin(ph + e.id * 0.7) * 0.12;
        } else if (P.preset === 'grow') {
          set(0);
          L.forEach(l => {
            if (tt >= l.d) l.dead = l.d;
          });
        } else {
          // typed: letters arrive one by one, then the loop rests empty
          if (tt >= 4400) return;
          set(0);
          st.letters = L.filter(l => tt >= l.birth);
          st.textAll = false;
        }

        this.render(B, tt, st);

        if (P.preset === 'typed') {
          const born = st.letters;
          const last = born[born.length - 1];
          const S = P.S;
          if (Math.floor(tt / 400) % 2 === 0 || (last && tt - last.birth < 300)) {
            const x = last ? last.tx + last.tw / 2 + 0.07 * S : 540;
            const y = last ? last.ty - 0.33 * S : 540;
            const w = Math.max(2, S * 0.03);
            const h = 0.8 * S;
            B.rect(x - w / 2, y - h / 2, w, h, st.C.text);
          }
        }
      }

      // ---------- export ----------
      dl(blob, name) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      }

      // the garden as it is right now, without the caret
      savePNG() {
        this.paint(performance.now(), false);
        this.el.canvas.toBlob(b => {
          if (b) this.dl(b, 'garden.png');
          else console.warn('Type Garden: the PNG could not be encoded');
        });
      }

      // the same frame drawn into SVG paths instead of the canvas; letters stay live text
      saveSVG() {
        const parts = [];
        const n = v => Math.round(v * 100) / 100;
        const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        // each letter gets an id, so its layer has a name in a design tool
        const seen = {};
        const lid = ch => {
          const b = ch.toLowerCase() !== ch.toUpperCase() ? ch : /[0-9]/.test(ch) ? 'digit-' + ch : 'glyph';
          seen[b] = (seen[b] || 0) + 1;
          return seen[b] > 1 ? b + '-' + seen[b] : b;
        };
        // records path() calls as SVG path data
        const pb = () => ({
          d: '',
          moveTo(x, y) {
            this.d += `M${n(x)} ${n(y)}`;
          },
          lineTo(x, y) {
            this.d += `L${n(x)} ${n(y)}`;
          },
          quadraticCurveTo(a, b, x, y) {
            this.d += `Q${n(a)} ${n(b)} ${n(x)} ${n(y)}`;
          },
          closePath() {
            this.d += 'Z';
          }
        });
        const B = {
          fill: (p, col) => {
            const b = pb();
            this.path(b, p, true);
            parts.push(`<path d="${b.d}" fill="${col}"/>`);
          },
          stroke: (p, col, w) => {
            const b = pb();
            this.path(b, p, false);
            parts.push(`<path d="${b.d}" fill="none" stroke="${col}" stroke-width="${n(w)}" stroke-linecap="round" stroke-linejoin="round"/>`);
          },
          rect: () => {},
          text: (ch, x, y, S, col) => {
            parts.push(`<text id="${esc(lid(ch))}" x="${n(x)}" y="${n(y)}" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="${n(S)}" fill="${col}">${esc(ch)}</text>`);
          }
        };
        this.render(B, performance.now(), this.mainState());
        const W = n(this.W);
        const H = n(this.H);
        const svg = [
          `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`,
          `<style>@import url('${SVG_FONT_CSS}');</style>`,
          `<rect width="100%" height="100%" fill="${this.pal().bg}"/>`,
          ...parts,
          '</svg>'
        ].join('\n');
        this.dl(new Blob([svg], { type: 'image/svg+xml' }), 'garden.svg');
      }
    }

    new TypeGarden();
  </script>
</body>
</html>
